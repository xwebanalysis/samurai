<section class="panel">
  <div class="metric-grid" role="list" [attr.aria-label]="'Scanner key metrics' | t">
    <app-metric-card
      label="PORTS_FOUND"
      [value]="vulnerabilitiesFound"
      [ariaLabel]="('Ports found: ' | t) + vulnerabilitiesFound"
    ></app-metric-card>

    <app-metric-card
      label="CONTACT_ARTIFACTS"
      [value]="contactsFound"
      [ariaLabel]="('Contact artifacts: ' | t) + contactsFound"
    ></app-metric-card>

    <app-metric-card
      label="UNSANITIZED_SURFACES"
      [value]="unsanitizedFindings"
      [ariaLabel]="('Unsanitized surfaces: ' | t) + unsanitizedFindings"
    ></app-metric-card>

    <app-metric-card
      label="DELTA_OPEN_PORTS"
      [value]="latestOpenPortDelta"
      [ariaLabel]="latestOpenPortDelta === null ? ('Open ports delta unavailable' | t) : ('Open ports delta: ' | t) + latestOpenPortDelta"
    ></app-metric-card>
  </div>

  <div class="open-ports-wrap" *ngIf="openPortsDetailed.length">
    <span class="t-label">{{ 'OPEN_PORTS_DETECTED' | t }}</span>
    <div class="open-ports-grid" role="list" [attr.aria-label]="'Open ports detected' | t">
      <div
        class="port-pill"
        *ngFor="let port of openPortsDetailed"
        role="listitem"
        [attr.aria-label]="('Port ' | t) + port.token + (', service ' | t) + port.service + (', version ' | t) + port.version"
      >
        <span class="port-token">{{ port.token }}</span>
        <span class="port-service">{{ port.service }}</span>
        <span class="port-version">{{ port.version }}</span>
      </div>
    </div>
  </div>
</section>
